services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: edulibrary_dev_password
      POSTGRES_DB: edulibrary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      WORKER_SHARED_SECRET: dev-worker-secret
      APP_CALLBACK_URL: http://app:3000/api/internal/worker-callback
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin_password
      R2_BUCKET: edulibrary-cloud
    ports:
      - "4000:4000"
    depends_on:
      - minio

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npm run build && npm start"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQL_HOST: postgres
      SQL_USER: postgres
      SQL_PASSWORD: edulibrary_dev_password
      SQL_DB_NAME: edulibrary
      JWT_SECRET: dev-jwt-secret-change-in-production-32chars
      WORKER_URL: http://worker:4000
      WORKER_SHARED_SECRET: dev-worker-secret
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin_password
      R2_BUCKET: edulibrary-cloud
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
      - worker

volumes:
  pgdata:
  miniodata:
