name: EduLibrary Cloud CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit & integration tests
        run: npx tsx --test src/lib/*.test.ts src/middleware/*.test.ts

      - name: Build production frontend bundle
        run: npm run build

  worker-docker-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build LibreOffice Worker Docker image
        run: docker build -t edulibrary-worker:ci ./worker
